<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Polyphonic Synth — Refined Drafting Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #f0eee9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
  }
  #root { height: 100vh; width: 100vw; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="themes-refined.jsx"></script>
<script type="text/babel" src="synth-controls-refined.jsx"></script>
<script type="text/babel" src="synth-panel-refined.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="refined"
        title="Refined Drafting Studies"
        subtitle="Three sophisticated directions on the blueprint axis. Hairline-only, monospace, no boxed sections, no wasted gutter."
      >
        <DCArtboard id="hairline" label="A · HAIRLINE-VIII — Knob Edition" width={1280} height={860}>
          <RefinedSynthPanel theme={themeHairline} />
        </DCArtboard>
        <DCArtboard id="hairline-fader" label="B · HAIRLINE-VIII — Fader Edition" width={1280} height={860}>
          <RefinedSynthPanel theme={themeHairlineFader} />
        </DCArtboard>
        <DCArtboard id="terminal" label="C · TERMINAL-Δ8 — Vector CAD" width={1280} height={860}>
          <RefinedSynthPanel theme={themeTerminal} />
        </DCArtboard>
        <DCArtboard id="cyanotype" label="D · CYANOTYPE 8 — Refined Blueprint" width={1280} height={860}>
          <RefinedSynthPanel theme={themeCyanotype} />
        </DCArtboard>
      </DCSection>

      <DCPostIt x={40} y={40} width={280}>
        <div style={{fontFamily:'"Inter", system-ui', fontSize:13, lineHeight:1.5}}>
          <strong>Refined direction</strong><br/>
          • No boxed sections — hairline dividers only, one drafting sheet<br/>
          • Outline knobs with accent indicator (no chrome bodies)<br/>
          • Monospace labels &amp; values, tabular density<br/>
          • Drafting title block, sheet annotations, dimension line<br/>
          • Reordered into 3 bands for tighter packing
        </div>
      </DCPostIt>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
